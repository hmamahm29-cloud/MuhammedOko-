<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد عكو | الملف الشخصي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        },
                        whatsapp: '#25D366',
                        whatsappHover: '#1da851'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .toast {
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-800">

    <!-- Ambient Background Lighting Accent Effects -->
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Container Card -->
    <div class="w-full max-w-md glass-card rounded-3xl p-8 shadow-2xl relative z-10 border border-slate-100/30 transition-all duration-300 hover:shadow-slate-900/10">
        
        <!-- Avatar Section -->
        <div class="flex flex-col items-center">
            <div class="relative group mb-5">
                <div class="w-28 h-28 rounded-full bg-gradient-to-tr from-sky-500 to-emerald-400 p-1 shadow-lg transform transition duration-300 group-hover:scale-105">
                    <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-3xl font-bold text-white shadow-inner">
                        <span>م.ع</span>
                    </div>
                </div>
                <!-- Status Badge -->
                <span class="absolute bottom-1 right-1 w-5 h-5 bg-emerald-500 border-2 border-white rounded-full shadow-sm" title="متاح للتواصل"></span>
            </div>

            <!-- User Info Header -->
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-wide mb-1">محمد عكو</h1>
            <p class="text-slate-500 text-sm font-medium mb-6">Mohamad Akko</p>
        </div>

        <!-- Action Links Section -->
        <div class="space-y-4 w-full">
            
            <!-- WhatsApp Direct Button -->
            <a href="https://wa.me/963967629010" target="_blank" rel="noopener noreferrer" 
               class="flex items-center justify-between w-full p-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl shadow-md shadow-emerald-500/20 transition-all duration-200 group active:scale-[0.99]">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <div class="text-right">
                        <span class="block font-bold text-base leading-tight">تواصل عبر الواتساب</span>
                        <span class="text-xs text-emerald-100 font-sans opacity-90" dir="ltr">+963 967 629 010</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left text-white/70 group-hover:-translate-x-1 transition-transform"></i>
            </a>

            <!-- Email Card with Copy Button -->
            <div class="flex items-center justify-between w-full p-4 bg-slate-50 border border-slate-200/80 rounded-2xl shadow-sm hover:border-sky-300 transition-all">
                <div class="flex items-center space-x-3 space-x-reverse overflow-hidden">
                    <div class="w-10 h-10 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center text-lg flex-shrink-0">
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                    <div class="text-right overflow-hidden">
                        <span class="block text-xs font-semibold text-slate-400">البريد الإلكتروني</span>
                        <span id="emailText" class="block font-semibold text-slate-700 text-sm sm:text-base truncate font-sans" dir="ltr">hmamahm29@gmail.com</span>
                    </div>
                </div>
                <button onclick="copyEmail()" class="flex-shrink-0 mr-2 p-2.5 text-slate-500 hover:text-sky-600 hover:bg-sky-50 rounded-xl transition-all" title="نسخ البريد">
                    <i id="copyIcon" class="fa-regular fa-copy text-lg"></i>
                </button>
            </div>

        </div>

        <!-- Footer Note -->
        <div class="mt-8 pt-5 border-t border-slate-200/60 text-center">
            <p class="text-xs text-slate-400">جميع الحقوق محفوظة &copy; <span id="year"></span></p>
        </div>
    </div>

    <!-- Toast Notification for Copy Action -->
    <div id="toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 space-x-reverse opacity-0 pointer-events-none z-50 transform translate-y-4">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span class="text-sm font-medium">تم نسخ البريد الإلكتروني بنجاح!</span>
    </div>

    <!-- JavaScript for Interactions -->
    <script>
        // Set dynamic current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Copy Email Functionality
        function copyEmail() {
            const email = document.getElementById('emailText').innerText;
            const copyIcon = document.getElementById('copyIcon');
            const toast = document.getElementById('toast');

            // Use legacy copy for max compatibility in iframe/web environments
            const tempInput = document.createElement('input');
            tempInput.value = email;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            // Change copy icon feedback
            copyIcon.classList.remove('fa-regular', 'fa-copy');
            copyIcon.classList.add('fa-solid', 'fa-check', 'text-emerald-500');

            // Show Toast Notification
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            // Reset icon and hide toast after 2.5 seconds
            setTimeout(() => {
                copyIcon.classList.remove('fa-solid', 'fa-check', 'text-emerald-500');
                copyIcon.classList.add('fa-regular', 'fa-copy');

                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2500);
        }
    </script>
</body>
</html>
